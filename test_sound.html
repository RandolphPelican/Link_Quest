<!DOCTYPE html>
<html>
<head>
    <title>Sound System Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #eee;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #555;
        }
        .log {
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }
        .log-entry {
            margin: 5px 0;
            padding: 2px 5px;
        }
    </style>
</head>
<body>
    <h1>Sound System Test</h1>
    <p>Testing the sound system...</p>
    
    <div>
        <button onclick="playSound('attack')">Play Attack Sound</button>
        <button onclick="playSound('hit')">Play Hit Sound</button>
        <button onclick="playSound('spell')">Play Spell Sound</button>
        <button onclick="playSound('collect')">Play Collect Sound</button>
        <button onclick="playSound('door')">Play Door Sound</button>
    </div>
    
    <div>
        <button onclick="playMusic('level1')">Play Level 1 Music</button>
        <button onclick="playMusic('level2')">Play Level 2 Music</button>
        <button onclick="playMusic('level3')">Play Level 3 Music</button>
        <button onclick="stopMusic()">Stop Music</button>
    </div>
    
    <div class="log" id="log"></div>
    
    <script>
        // Simple logging function
        function log(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logDiv.appendChild(entry);
            console.log(message);
        }
        
        // Sound System (simplified version)
        const SoundSystem = {
            enabled: true,
            sounds: {},
            backgroundMusic: null,
            currentMusic: null,
            
            init() {
                // Check if audio is supported
                this.enabled = typeof Audio !== 'undefined';
                if (!this.enabled) {
                    log('Audio not supported in this browser');
                    return;
                }
                
                log('Sound system initialized');
                
                // Create sounds (they will fail to load since files don't exist, but that's ok for testing)
                this.sounds = {
                    attack: new Audio('assets/sounds/attack.wav'),
                    hit: new Audio('assets/sounds/hit.wav'),
                    spell: new Audio('assets/sounds/spell.wav'),
                    collect: new Audio('assets/sounds/collect.wav'),
                    door: new Audio('assets/sounds/door.wav')
                };
                
                // Set volume
                Object.values(this.sounds).forEach(sound => {
                    sound.volume = 0.3;
                });
                
                // Background music
                this.backgroundMusic = {
                    level1: new Audio('assets/sounds/music_level1.mp3'),
                    level2: new Audio('assets/sounds/music_level2.mp3'),
                    level3: new Audio('assets/sounds/music_level3.mp3')
                };
                
                Object.values(this.backgroundMusic).forEach(music => {
                    music.volume = 0.2;
                    music.loop = true;
                });
            },
            
            play(name) {
                if (!this.enabled) {
                    log('Sound system disabled');
                    return;
                }
                
                const sound = this.sounds[name];
                if (!sound) {
                    log('Sound not found: ' + name);
                    return;
                }
                
                try {
                    sound.currentTime = 0;
                    sound.play();
                    log('Playing sound: ' + name);
                } catch (e) {
                    log('Sound play failed: ' + e.message);
                }
            },
            
            playMusic(name) {
                if (!this.enabled) {
                    log('Sound system disabled');
                    return;
                }
                
                const music = this.backgroundMusic[name];
                if (!music) {
                    log('Music not found: ' + name);
                    return;
                }
                
                // Stop current music
                if (this.currentMusic) {
                    this.currentMusic.pause();
                    this.currentMusic.currentTime = 0;
                    log('Stopped current music');
                }
                
                this.currentMusic = music;
                this.currentMusic.currentTime = 0;
                this.currentMusic.play();
                log('Playing music: ' + name);
            },
            
            stopMusic() {
                if (this.currentMusic) {
                    this.currentMusic.pause();
                    this.currentMusic.currentTime = 0;
                    this.currentMusic = null;
                    log('Stopped music');
                }
            }
        };
        
        // Initialize sound system
        SoundSystem.init();
        
        // Expose functions to buttons
        window.playSound = function(name) {
            SoundSystem.play(name);
        };
        
        window.playMusic = function(name) {
            SoundSystem.playMusic(name);
        };
        
        window.stopMusic = function() {
            SoundSystem.stopMusic();
        };
        
        log('Sound test ready!');
    </script>
</body>
</html>
