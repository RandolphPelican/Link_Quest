<!DOCTYPE html>
<html>
<head>
    <title>Sprite Loading Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #eee;
            padding: 20px;
        }
        canvas {
            background-color: #222;
            border: 2px solid #444;
            margin-top: 20px;
        }
        .log {
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 2px 5px;
        }
        .log-info { color: #47c7ff; }
        .log-success { color: #2ecc71; }
        .log-warn { color: #f39c12; }
        .log-error { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>Sprite Loading Test</h1>
    <p>Testing enemy sprite loading and rendering...</p>
    
    <button id="loadBtn">Load Sprites</button>
    <button id="drawBtn" disabled>Draw Enemy</button>
    
    <div class="log" id="log"></div>
    
    <canvas id="testCanvas" width="800" height="600"></canvas>
    
    <script>
        // Simple logging function
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = message;
            logDiv.appendChild(entry);
            console.log('[' + type.toUpperCase() + '] ' + message);
        }
        
        // Canvas setup
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        
        // Sprites object (simplified version)
        const Sprites = {
            loaded: false,
            sheets: {},
            
            ENEMIES: {
                goblin:        { col: 4, row: 0 },
                goblin_chief:  { col: 6, row: 0 },
                ai_bug:        { col: 0, row: 1 },
                chatbot_clone: { col: 2, row: 2 }
            },
            
            load(onDone) {
                log('Starting sprite loading...', 'info');
                
                const sources = {
                    monsters: 'assets/characters/monsters.png'
                };
                
                let remaining = Object.keys(sources).length;
                let failed = 0;
                
                Object.entries(sources).forEach(([key, src]) => {
                    log('Loading sprite sheet: ' + key + ' from ' + src, 'info');
                    
                    const img = new Image();
                    img.onload = () => {
                        this.sheets[key] = img;
                        log('Successfully loaded sheet: ' + key, 'success');
                        remaining--;
                        if (remaining === 0) {
                            this.loaded = true;
                            log('All sprites loaded!', 'success');
                            if (onDone) onDone();
                        }
                    };
                    img.onerror = () => {
                        log('Failed to load sheet: ' + src, 'error');
                        failed++;
                        remaining--;
                        if (remaining === 0) {
                            this.loaded = true;
                            log('Sprite loading completed with ' + failed + ' failures', 'warn');
                            if (onDone) onDone();
                        }
                    };
                    img.src = src;
                });
            },
            
            drawEnemy(enemyType, x, y, facing, animFrame, scale, isHit) {
                log('Attempting to draw enemy sprite for type: ' + enemyType, 'info');
                
                const def = this.ENEMIES[enemyType];
                if (!def) {
                    log('Sprite not found for enemy type: ' + enemyType, 'error');
                    return false;
                }
                
                log('Found sprite definition for ' + enemyType + ': col=' + def.col + ', row=' + def.row, 'info');
                
                if (!this.sheets.monsters) {
                    log('Monsters sprite sheet not loaded', 'error');
                    return false;
                }
                
                log('Monsters sprite sheet loaded, drawing enemy...', 'info');
                
                const s = scale || 2.5;
                const drawW = 32 * s;
                const drawH = 32 * s;
                
                ctx.save();
                ctx.translate(x, y);
                
                if (facing === 'left') {
                    ctx.scale(-1, 1);
                }
                
                if (isHit) {
                    ctx.globalAlpha = 0.5;
                }
                
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(
                    this.sheets.monsters,
                    def.col * 32, def.row * 32, 32, 32,
                    -drawW/2, -drawH/2, drawW, drawH
                );
                
                ctx.restore();
                log('Successfully drew enemy sprite for type: ' + enemyType, 'success');
                return true;
            }
        };
        
        // Event listeners
        document.getElementById('loadBtn').addEventListener('click', () => {
            log('Loading sprites...', 'info');
            Sprites.load(() => {
                document.getElementById('drawBtn').disabled = false;
            });
        });
        
        document.getElementById('drawBtn').addEventListener('click', () => {
            if (!Sprites.loaded) {
                log('Sprites not loaded yet!', 'error');
                return;
            }
            
            log('Drawing test enemies...', 'info');
            
            // Clear canvas
            ctx.fillStyle = '#182030';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw some test enemies
            const enemies = [
                { type: 'goblin', x: 200, y: 200, facing: 'right' },
                { type: 'goblin_chief', x: 400, y: 200, facing: 'left' },
                { type: 'ai_bug', x: 600, y: 200, facing: 'right' },
                { type: 'chatbot_clone', x: 200, y: 400, facing: 'left' }
            ];
            
            enemies.forEach(enemy => {
                const success = Sprites.drawEnemy(enemy.type, enemy.x, enemy.y, enemy.facing, 0, 2.5, false);
                if (!success) {
                    // Draw fallback square
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(enemy.x - 25, enemy.y - 25, 50, 50);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('FALLBACK', enemy.x, enemy.y);
                }
            });
        });
    </script>
</body>
</html>
