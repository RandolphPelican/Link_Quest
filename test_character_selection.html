<!DOCTYPE html>
<html>
<head>
    <title>Character Selection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .char-card {
            width: 120px;
            height: 180px;
            background-color: #ddd;
            border: 2px solid #999;
            margin: 10px;
            cursor: pointer;
            display: inline-block;
        }
        .char-card.selected {
            border-color: gold;
            box-shadow: 0 0 10px gold;
        }
        #solo-btn, #host-btn, #join-btn {
            padding: 10px 20px;
            margin: 10px;
            border: 2px solid #999;
            background: transparent;
            cursor: not-allowed;
        }
        #solo-btn.ready, #host-btn.ready, #join-btn.ready {
            border-color: gold;
            color: gold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Character Selection Test</h1>
    
    <div id="char-grid">
        <div class="char-card" data-char="lincoln">
            <div class="char-avatar">Lincoln</div>
        </div>
        <div class="char-card" data-char="journey">
            <div class="char-avatar">Journey</div>
        </div>
    </div>
    
    <div id="mp-options">
        <button id="solo-btn" disabled>Solo Adventure</button>
        <button id="host-btn" disabled>Host Game</button>
        <div id="join-row">
            <input id="join-code" type="text" maxlength="4" placeholder="CODE" />
            <button id="join-btn" disabled>Join</button>
        </div>
    </div>
    
    <script>
        // Simulate the character selection logic
        const cards = document.querySelectorAll('.char-card');
        const soloBtn = document.getElementById('solo-btn');
        const hostBtn = document.getElementById('host-btn');
        const joinBtn = document.getElementById('join-btn');
        
        let selectedChar = null;
        
        cards.forEach(c => {
            c.onclick = (e) => {
                const card = e.target.closest('.char-card');
                if (!card) return;
                
                cards.forEach(cd => cd.classList.remove('selected'));
                card.classList.add('selected');
                selectedChar = card.dataset.char;
                
                console.log('Selected:', selectedChar);
                
                // Enable buttons
                [soloBtn, hostBtn, joinBtn].forEach(btn => {
                    if (btn) {
                        btn.disabled = false;
                        btn.classList.add('ready');
                        btn.style.cursor = 'pointer';
                        btn.style.pointerEvents = 'auto';
                    }
                });
                
                if (soloBtn) soloBtn.textContent = 'Solo as ' + selectedChar;
            };
        });
        
        soloBtn.onclick = () => {
            if (!selectedChar) {
                alert('Please pick a character first!');
                return;
            }
            alert('Starting solo adventure as ' + selectedChar);
        };
        
        hostBtn.onclick = () => {
            if (!selectedChar) {
                alert('Pick a character first!');
                return;
            }
            alert('Hosting game as ' + selectedChar);
        };
        
        joinBtn.onclick = () => {
            const code = document.getElementById('join-code').value.trim();
            if (!selectedChar) { alert('Pick a character first!'); return; }
            if (!code || code.length < 4) { alert('Enter a 4-letter room code!'); return; }
            alert('Joining room ' + code + ' as ' + selectedChar);
        };
    </script>
</body>
</html>
